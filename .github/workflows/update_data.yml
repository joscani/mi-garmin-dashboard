name: Actualizar datos de natación

on:
  schedule:
    - cron: "0 10 * * *"   # 12:00 hora España verano (UTC+2) / 11:00 invierno (UTC+1)
    - cron: "0 21 * * *"   # 23:00 hora España verano (UTC+2) / 22:00 invierno (UTC+1)
  workflow_dispatch:        # También se puede lanzar manualmente desde GitHub

jobs:
  fetch-and-upload:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3

      - name: Instalar dependencias Python
        run: uv sync

      - name: Recuperar tokens de Garmin del repo privado
        env:
          DATA_GITHUB_PAT: ${{ secrets.DATA_GITHUB_PAT }}
        run: |
          git clone https://x-access-token:${DATA_GITHUB_PAT}@github.com/joscani/garmin-data.git /tmp/garmin-data
          mkdir -p .garminconnect
          cp /tmp/garmin-data/.garminconnect/* .garminconnect/

      - name: Descargar datos de Garmin Connect
        env:
          GARMIN_EMAIL:    ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: uv run python src/fetch_swimming.py

      - name: Guardar tokens actualizados en repo privado
        env:
          DATA_GITHUB_PAT: ${{ secrets.DATA_GITHUB_PAT }}
        run: |
          cp .garminconnect/* /tmp/garmin-data/.garminconnect/
          cd /tmp/garmin-data
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add .garminconnect/
          git diff --cached --quiet || git commit -m "Actualizar tokens Garmin $(date '+%Y-%m-%d')"
          git push

      - name: Subir CSVs al repo privado de datos
        run: |
          cp data/swimming_activities.csv /tmp/garmin-data/
          cp data/swimming_laps.csv /tmp/garmin-data/
          cd /tmp/garmin-data
          git add swimming_activities.csv swimming_laps.csv
          git diff --cached --quiet || git commit -m "Actualizar datos $(date '+%Y-%m-%d')"
          git push
